name: Deploy to Vercel on Version Bump

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

  # Cho phép bấm tay kích hoạt deploy Vercel bất cứ khi nào cần
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Bắt buộc kích hoạt Vercel deploy ngay lập tức?'
        required: true
        type: boolean
        default: true

jobs:
  check-and-deploy:
    name: Check Version & Trigger Vercel Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Lấy 2 commit gần nhất để so sánh version

      - name: Kiểm tra thay đổi version trong package.json
        id: check_version
        run: |
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "🚀 Kích hoạt deploy thủ công qua Run workflow (force_deploy = true)."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Lấy version commit trước và hiện tại
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | jq -r '.version // empty' || echo "")
          CURR_VERSION=$(jq -r '.version // empty' package.json)

          echo "🔍 Phiên bản trước: ${PREV_VERSION:-Chưa xác định}"
          echo "🔍 Phiên bản hiện tại: ${CURR_VERSION:-Chưa xác định}"

          if [ -n "$CURR_VERSION" ] && [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "🎯 Phát hiện nâng cấp version từ '${PREV_VERSION}' -> '${CURR_VERSION}'!"
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "new_version=$CURR_VERSION" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ package.json thay đổi nhưng trường version không đổi (${CURR_VERSION}). Bỏ qua deploy."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Gửi tín hiệu Vercel Deploy Hook
        if: steps.check_version.outputs.should_deploy == 'true'
        run: |
          DEPLOY_HOOK="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

          if [ -z "$DEPLOY_HOOK" ]; then
            echo "❌ LỖI: Chưa cấu hình Secret 'VERCEL_DEPLOY_HOOK_URL' trong GitHub Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "🚀 Đang gửi tín hiệu kích hoạt Vercel Deploy Hook..."
          HTTP_STATUS=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" -X POST "$DEPLOY_HOOK")

          echo "📥 Mã phản hồi từ Vercel: $HTTP_STATUS"
          if [ -f /tmp/deploy_response.json ]; then
            cat /tmp/deploy_response.json
            echo ""
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "🎉 Vercel đã nhận tín hiệu thành công và đang tự động build bản cập nhật!"
          else
            echo "❌ Gọi Vercel Deploy Hook thất bại với mã HTTP: $HTTP_STATUS"
            exit 1
          fi
